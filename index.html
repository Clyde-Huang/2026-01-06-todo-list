<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todolist</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <section class="section-box">
            <div class="input-box">
                <input type="text" class="input-content" id="todo-input" placeholder="請輸入待辦事項...">
                <button class="btn" onclick="addTodo()">送出</button>
            </div>

            <div class="filter-box">
                <div class="filter-buttons">
                    <h4>快速搜尋: </h4>
                    <button class="btn filter-btn active" onclick="filterByStatus('all')">全部</button>
                    <button class="btn filter-btn" onclick="filterByStatus('completed')">已完成 ✅</button>
                    <button class="btn filter-btn" onclick="filterByStatus('uncompleted')">未完成 ❌</button>
                </div>
            </div>

            <ul class="list-box" id="todo-container"></ul>
            
            <button class="btn delete-all" onclick="delAll()">刪除全部</button>
        </section>
    </main>

    <script src="./script.js"></script>
    
</body>

</html>
